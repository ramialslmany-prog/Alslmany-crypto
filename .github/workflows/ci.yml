name: CI

# Runs the same four steps as `npm run verify` and the pre-push hook.
# One definition of "verified" lives in package.json; this workflow calls it
# rather than restating it, so the hosted check and the local check cannot
# drift apart and quietly disagree about what passing means.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # From the lockfile, so CI cannot pass on a dependency tree the
      # repository does not pin.
      - run: npm ci

      - run: npm run verify
        env:
          NEXT_TELEMETRY_DISABLED: "1"
