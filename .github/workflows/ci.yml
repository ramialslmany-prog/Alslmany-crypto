name: CI

# Runs the same checks as `backend/verify.sh` and the pre-push hook.
# One definition of "verified" lives in that script; this workflow calls it
# rather than restating the steps, so the hosted check and the local gate
# cannot drift apart and quietly disagree about what passing means.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Format · Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e "backend[dev]"

      # verify.sh falls back to the ambient interpreter when there is no
      # backend/.venv, which is exactly the situation on a runner.
      - run: ./backend/verify.sh
