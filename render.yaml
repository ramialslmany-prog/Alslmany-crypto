# One-click deploy: Render reads this file from the repository and builds the
# service described here. No Docker daemon and no local tooling involved.
#
#   New > Blueprint > pick this repository > Apply
#
# The service serves the API under /api and the site at /, so the whole product
# lives behind a single URL and no cross-origin configuration is required.
services:
  - type: web
    name: alslmany
    runtime: python
    plan: free
    region: frankfurt

    # -e so `app` is imported from the checkout: main.py locates the frontend
    # relative to the package, and a copy in site-packages puts it somewhere
    # the site is not. test_deploy.py holds this.
    buildCommand: pip install -e ./backend
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT

    # Free instances sleep when idle and are woken by the next request, so the
    # first load after a quiet spell is slow. It is not a fault in the app.
    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

      # SQLite needs no server, and on the free plan it is ERASED on every
      # deploy and every restart, because that plan has no persistent disk.
      # The paper ledger therefore resets — the strategy does not. For a
      # ledger that survives, create a Render PostgreSQL instance and set:
      #   DATABASE_URL=postgresql+asyncpg://...
      # (the +asyncpg driver is required; a plain postgresql:// URL will not
      # start, since every query in this codebase is async).
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./alslmany.db

      - key: SYMBOLS
        value: BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT,XRPUSDT
      - key: MARKET_DATA_PROVIDERS
        value: binance,okx

      # Generated by Render and never seen here. Guards the state-changing bot
      # routes; without it they refuse to run rather than run unprotected.
      - key: CRON_SECRET
        generateValue: true

      # Entered in the dashboard, deliberately not committed. Alerts stay off
      # until both are set, which is a supported state rather than an error.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: AI_API_KEY
        sync: false
